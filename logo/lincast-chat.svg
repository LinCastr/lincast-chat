<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="solidStreamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro do ícone -->
  <rect width="128" height="128" rx="28" fill="#141416"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Silhueta sólida: Hexágono dinâmico com projeção de transmissão à direita -->
  <path d="M 64 16 
           C 66 16, 68 17, 70 18 
           L 106 60 
           C 109 63, 109 65, 106 68 
           L 70 110 
           C 68 111, 66 112, 64 112 
           L 24 90 
           C 21 88, 20 86, 20 83 
           L 20 45 
           C 20 42, 21 40, 24 38 
           Z" 
        fill="url(#solidStreamGrad)"
        stroke="#ffffff"
        stroke-width="1"
        stroke-opacity="0.15"/>

  <!-- Corte em espaço negativo: Letra 'L' vazada com cantos arredondados -->
  <path d="M 44 38 
           L 44 82 
           C 44 86, 48 90, 52 90 
           L 76 90" 
        fill="none" 
        stroke="#141416" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Nós de conexão vazados do 'L' com miolo luminoso -->
  <!-- Topo da haste do L -->
  <circle cx="44" cy="38" r="7" fill="#141416"/>
  <circle cx="44" cy="38" r="3.5" fill="#38bdf8"/>

  <!-- Base do L -->
  <circle cx="76" cy="90" r="7" fill="#141416"/>
  <circle cx="76" cy="90" r="3.5" fill="#a5b4fc"/>
</svg>

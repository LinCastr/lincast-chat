# Workspace da v2. Tudo compila no mesmo `target/`, o que importa porque o
# libwebrtc é pesado (compilar duas vezes seria minutos à toa) e porque o
# `concord-audio` tem que sair na mesma pasta do app que o chama.
[workspace]
resolver = "3"
members = ["cliente", "concord-audio", "prototipo-tela"]
exclude = ["vendor"]

# Local copies of libwebrtc/webrtc-sys with one addition: `RtcAudioTrack::set_volume`
# (playout gain of a remote track, which the published crates do not expose).
[patch.crates-io]
libwebrtc = { path = "vendor/libwebrtc" }
webrtc-sys = { path = "vendor/webrtc-sys" }

[profile.dev.package."*"]
# Dependências otimizadas mesmo no build de desenvolvimento: codificar vídeo e
# desenhar a interface sem otimização deixa tudo lento demais pra testar.
opt-level = 2

[package]
name = "concord-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures-util = "0.3.34"
libwebrtc = { version = "0.3.51", features = ["glib-main-loop"] }
log = "0.4.34"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }
